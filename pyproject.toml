[project]
name = "slopymemory"
version = "0.2.0"
description = "Per-project memory for coding agents: one launcher, one registry, a store per project."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp>=1.27,<2",
    "tomli-w>=1.0",
    # the substrate (vendored under src/agent_memory)
    "psycopg[binary]>=3.2", "pgvector>=0.3", "pyyaml>=6.0", "numpy>=2.0", "scipy>=1.13",
    "umap-learn>=0.5", "huggingface_hub>=0.30",
    "sentence-transformers>=5.5,<5.6", "einops>=0.8", "transformers>=5.9,<5.10", "torch>=2.12,<2.13",
    "embedded-postgres>=18.6,<19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
slopymem = "slopymemory.cli:main"
slopymem-mcp = "slopymemory.launcher:main"

[tool.uv]
# torch from the CPU index only: the CUDA build is 5.6 GB and useless here (CPU wheel measures ~1.3 GB)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
markers = ["pg: creates and drops a real database (slopymem_test_<pid>)", "embed: loads the real embedder", "substrate: the vendored substrate's own tests (need a *_test database)"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopymemory", "src/agent_memory"]
