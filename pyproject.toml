[project]
name = "slopymemory"
version = "0.1.0"
description = "Per-project memory for coding agents: one launcher, one registry, a store per project."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["mcp>=1.27,<2", "tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
slopymem = "slopymemory.cli:main"
slopymem-mcp = "slopymemory.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["pg: creates and drops a real Postgres database (opt-in)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slopymemory"]
