# Weekly update pull requests for the locked Python dependencies and the GitHub Actions; each one runs CI.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Only inside the ranges pyproject.toml pins: those are deliberate, and widening one is a planned change.
    versioning-strategy: lockfile-only
    # Majors of these are planned migrations, not weekly bumps: MCP SDK v2 moves the server modules; a new major of
    # the embedding stack can change every stored vector and must be proven bit-identical first.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      - dependency-name: sentence-transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
      - dependency-name: torch
        update-types: ["version-update:semver-major"]
      # The model's download library: transformers pins its major, so a new one cannot resolve until they move.
      - dependency-name: huggingface-hub
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
